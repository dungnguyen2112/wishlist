<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist Nho Nho</title>
    <meta
      name="description"
      content="Wishlist dễ thương để lưu các món đồ người yêu thích và chọn mua quà sau này."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <main class="page">
      <header class="hero">
        <p class="eyebrow">wishlist cua be yeu</p>
        <h1>Goc Goi Y Qua Tang</h1>
        <p class="subtitle">
          Em cứ thêm những món em thích vào đây nha. Anh sẽ cân nhắc và chọn bất ngờ để tặng em.
        </p>
      </header>

      <section class="panel form-panel">
        <h2>Thêm món mới</h2>
        <form id="wishForm" class="wish-form" autocomplete="off">
          <div class="input-group">
            <label for="name">Tên món đồ</label>
            <input id="name" name="name" type="text" placeholder="Ví dụ: Son môi, túi xách..." required />
          </div>

          <div class="split-row">
            <div class="input-group">
              <label for="link">Link tham khảo (tùy ý)</label>
              <input id="link" name="link" type="url" placeholder="https://..." />
            </div>
            <div class="input-group">
              <label for="price">Giá dự kiến (VND)</label>
              <input id="price" name="price" type="number" min="0" step="1000" placeholder="500000" />
            </div>
          </div>

          <div class="split-row">
            <div class="input-group">
              <label for="priority">Độ ưu tiên</label>
              <select id="priority" name="priority">
                <option value="high">Rất thích</option>
                <option value="medium" selected>Thích</option>
                <option value="low">Có cũng được</option>
              </select>
            </div>
            <div class="input-group">
              <label for="note">Ghi chú (tùy ý)</label>
              <input id="note" name="note" type="text" maxlength="120" placeholder="Màu, size, mô tả nho nhỏ..." />
            </div>
          </div>

          <button type="submit" class="btn btn-primary">+ Thêm vào wishlist</button>
        </form>
      </section>

      <section class="panel tools-panel">
        <div class="tools-header">
          <h2>Danh sách yêu thích</h2>
          <div class="count" id="wishCount">0 món</div>
        </div>

        <div class="tool-row">
          <label for="filter" class="sr-only">Lọc theo trạng thái</label>
          <select id="filter" class="mini-control">
            <option value="all">Tất cả</option>
            <option value="open">Chưa mua</option>
            <option value="picked">Đã được chọn mua</option>
            <option value="gifted">Đã tặng</option>
          </select>

          <button id="pickBtn" class="btn btn-accent" type="button">Chọn ngẫu nhiên 1 món</button>
          <button id="clearGiftedBtn" class="btn btn-ghost" type="button">Xóa mục đã tặng</button>
        </div>

        <p id="pickedResult" class="picked-result" aria-live="polite"></p>

        <ul id="wishList" class="wish-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="wishItemTemplate">
      <li class="wish-item">
        <div class="wish-main">
          <h3 class="wish-name"></h3>
          <div class="meta-row">
            <span class="wish-priority badge"></span>
            <span class="wish-price"></span>
          </div>
          <p class="wish-note"></p>
          <a class="wish-link" target="_blank" rel="noopener noreferrer">Xem món này</a>
        </div>
        <div class="wish-actions">
          <button class="btn btn-sm btn-soft" data-action="toggle-picked" type="button"></button>
          <button class="btn btn-sm btn-soft" data-action="toggle-gifted" type="button"></button>
          <button class="btn btn-sm btn-danger" data-action="delete" type="button">Xóa</button>
        </div>
      </li>
    </template>

    <script type="module" src="script.js"></script>
  </body>
</html>
